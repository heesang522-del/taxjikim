spring:
  ai:
    openai:
      # 실제 키는 Windows 사용자 환경변수에 등록한다.
      # no-key일 때 호출을 막는 처리는 Java 코드에서 수행한다.
      api-key: ${OPENAI_API_KEY:no-key}

      # 재시도가 있으면 전체 소요 시간은 30초를 넘을 수 있다.
      timeout: 30s
      max-retries: 1

      chat:
        model: gpt-5.6-luna

    retry:
      max-attempts: 1

  servlet:
    multipart:
      # 파일과 multipart 부가 데이터를 받을 수 있게 여유를 둔다.
      max-file-size: 6MB
      max-request-size: 7MB

  mail:
    host: smtp.gmail.com
    port: 587

    # 발신용 Gmail 주소와 앱 비밀번호를 환경변수에서 읽는다.
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}

    properties:
      mail:
        smtp:
          auth: true
          connectiontimeout: 5000
          timeout: 5000
          starttls:
            enable: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  datasource:
    url: ${DB_URL:jdbc:mysql://192.168.10.16:3306/TAXJIKIM?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:server}
    password: ${DB_PASSWORD:server}
    driver-class-name: com.mysql.cj.jdbc.Driver

# React의 vite.config.js API_TARGET과 맞춘다.
server:
  port: ${SERVER_PORT:8080}

mybatis:
  mapper-locations: classpath:mappers/**/*.xml
  type-aliases-package: com.kh.back.**.dto
  configuration:
    map-underscore-to-camel-case: true

logging:
  level:
    com.kh.back: debug

python:
  api-url: ${PYTHON_API_URL:http://127.0.0.1:8000}

tax:
  ocr:
    tessdata-path: ${TAX_OCR_TESSDATA_PATH:./tessdata}
    language: kor+eng
    dpi: 200
    max-pages: 50
    max-rendered-pixels: 12000000

# 실제 실행에는 @EnableScheduling이 필요하다.
# 별도 zone 지정이 없으면 JVM 시간대를 기준으로 실행한다.
custom:
  cron: "0 0 3 * * *"

jwt:
  secret: my-temporary-secret-key-for-jwt-authentication-demo-project-2026-safe
  access-token-expiration: 1800000
  refresh-token-expiration: 1209600000

file:
  upload-dir:
    post: C:/TAXJIKIM/back/uploads/posts