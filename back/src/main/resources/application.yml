spring:
  application:
    name: back
  # DB 접속 정보
  datasource:
    url: jdbc:mysql://localhost:3306/final_sample?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: server
    password: server
    driver-class-name: com.mysql.cj.jdbc.Driver

# 서버 포트 (React 의 vite.config.js API_TARGET 과 같아야 한다)
server:
  port: 8080

mybatis:
  # Mapper XML 위치
  mapper-locations: classpath:mappers/**/*.xml
  # XML 에서 패키지 없이 클래스명만 쓸 수 있게 해 주는 기준 패키지
  type-aliases-package: com.kh.back.**.dto
  configuration:
    # 컬럼명이 sector_name 처럼 snake_case 여도 자바 필드 sectorName 에 자동 매핑
    map-underscore-to-camel-case: true

# 실행되는 SQL 을 콘솔에서 보기 위한 로그 레벨
logging:
  level:
    com.kh.back: debug