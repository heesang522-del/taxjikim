spring:
  config:
    # back 폴더에서 실행한다. 외부 키 파일 경로는 JWT_SECRET_FILE로 변경할 수 있다.
    import: "optional:file:${JWT_SECRET_FILE:./config/jwt-secret.properties}"
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    # Gmail 앱 비밀번호를 환경변수로 제공한다.
    properties:
      mail:
        smtp:
          auth: true
          connectiontimeout: 5000
          timeout: 5000
          starttls:
            enable: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  datasource:
    url: jdbc:mysql://${DB_HOST:192.168.10.16}:3306/TAXJIKIM?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:server}
    password: ${DB_PASSWORD:server}
    driver-class-name: com.mysql.cj.jdbc.Driver

# 서버 포트 (React 의 vite.config.js API_TARGET 과 같아야 한다)
server:
  port: ${SERVER_PORT:8080}

mybatis:
  # Mapper XML 위치
  mapper-locations: classpath:mappers/**/*.xml
  # XML 에서 패키지 없이 클래스명만 쓸 수 있게 해 주는 기준 패키지
  type-aliases-package: com.kh.back.**.dto
  configuration:
    # 컬럼명이 sector_name 처럼 snake_case 여도 자바 필드 sectorName 에 자동 매핑
    map-underscore-to-camel-case: true

# 실행되는 SQL 을 콘솔에서 보기 위한 로그 레벨
logging:
  level:
    com.kh.back: debug

# 🌟 S3Config에서 참조하는 AWS S3 설정 추가
aws:
  s3:
    bucket: your-bucket-name
    access-key: "YOUR_AWS_ACCESS_KEY"
    secret-key: "YOUR_AWS_SECRET_KEY"
    region: ap-northeast-2

# 🌟 파일 업로드 디렉토리 설정 추가
file:
  upload-dir:
    post: "C:/uploads/post"
# 회원 정리·휴면 처리 주기. 실제 실행에는 @EnableScheduling이 필요하다.
# 별도 zone 지정이 없으므로 JVM의 시간대를 기준으로 실행한다.
custom:
  cron: "0 0 3 * * *"

jwt:
  # 로컬 키 파일 또는 JWT_SECRET 환경변수의 Base64 키를 사용한다.
  secret: ${JWT_SECRET}
  access-token-expiration: 1800000 # 30분, 밀리초
  refresh-token-expiration: 1209600000 # 14일, 밀리초
