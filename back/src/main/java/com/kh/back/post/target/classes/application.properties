spring.application.name=com.post

# JSP view resolver
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp

# 파일 업로드 용량 제한 설정
spring.servlet.multipart.max-file-size=5GB
spring.servlet.multipart.max-request-size=5GB
server.tomcat.max-swallow-size=5GB

# MyBatis
# type-aliases: XML에서 FQCN 대신 클래스 단순명 사용 (예: PostDto)
mybatis.type-aliases-package=com.post.common.response,com.post.post.dto
# Mapper XML 위치: resources/mappers/{Domain}Mapper.xml
mybatis.mapper-locations=classpath:mappers/**/*.xml
# DB 컬럼 snake_case <-> Java 필드 camelCase 자동 매핑
mybatis.configuration.map-underscore-to-camel-case=true

# 파일 업로드 물리적 경로 설정
file.upload-dir.post=C:/uploads/files/
file.upload-dir.files=C:/uploads/files/

# 새로 추가한 파일 업로드 프로퍼티
file.upload-dir.profile=C:/uploads/profile/


# MySQL - 운영 환경에서는 아래 환경변수를 주입하세요.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/post?serverTimezone=Asia/Seoul&useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:post}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:post}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.initialization-fail-timeout=-1

# DB를 사용하는 기능이 호출되기 전에 연결 및 초기화 SQL을 실행하지 않습니다.
spring.sql.init.mode=never

# UTF-8 인코딩 강제
spring.servlet.encoding.charset=UTF-8
spring.servlet.encoding.enabled=true
spring.servlet.encoding.force=true
server.tomcat.uri-encoding=UTF-8

server.error.whitelabel.enabled=false
server.tomcat.connection-timeout=60000


# ==========================================
# [선택 1] 로컬 무료 테스트용 (MinIO 사용 시)
# ==========================================
aws.s3.endpoint=http://localhost:9000
aws.s3.bucket=my-test-bucket
aws.s3.region=us-east-1
cloud.aws.credentials.access-key=minioadmin
cloud.aws.credentials.secret-key=minioadmin

# ==========================================
# [선택 2] 실제 운영 환경 (AWS S3 사용 시)
# ==========================================
# aws.s3.endpoint= (AWS 사용 시 이 줄은 아예 지우거나 주석 처리)
# aws.s3.bucket-name=실제-s3-버킷이름
# aws.s3.region=ap-northeast-2
# cloud.aws.credentials.access-key=YOUR_AWS_ACCESS_KEY
# cloud.aws.credentials.secret-key=YOUR_AWS_SECRET_KEY
